[project]
name = "demo-kit"
version = "2.0.0"
description = "Research demos drawn in pixel art, from a loop that really runs: a small pixel engine (plain JavaScript, no build) and a live half on the standard library that streams a running loop's chunks to a page that plays them."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Gabriel Béna", email = "gabriel.bena1@gmail.com" }]
requires-python = ">=3.12"
dependencies = []  # Python's standard library only: the kit never imports the consumer's science

[project.urls]
Homepage = "https://github.com/GabrielBena/demo-kit"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.400"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demokit"]

# Style SSOT — editor-on-save, CI, and any pytest lint gate all read this.
[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "I", "N", "C4", "SIM", "RUF"]
ignore = [
    "E501", # line too long (handled by the formatter)
    "B008", # function calls in argument defaults
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["demokit"]
